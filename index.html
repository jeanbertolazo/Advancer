</head><body>
<div id="abertura" style="position:fixed;inset:0;z-index:99999;background:#f2600c;display:flex;align-items:center;justify-content:center;transition:opacity .35s"><img src="icon-512.png" alt="" style="width:132px;height:132px;border-radius:28px"></div>

<style>
/* Layout: compact logbook in the style of set-tracking apps — one 600px column, set tables with SÉRIE | ANTERIOR | KG | REPS | ✓.
   Palette: white + neutral greys; orange = interface accent; green = only what is completed. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#f3f4f6; --ink:#111315; --ink2:#3d4248; --muted:#7a8088; --line:#eceef0; --line2:#d9dce0;
  --orange:#ea6a12; --orange-dk:#c4560a; --orange-soft:#fff3ea; --green:#16c25a; --green-soft:#dcfce7; --on-ink:#ffffff;
  --font:"Inter Tight","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px; color-scheme:light; --segbg:#e7e9ec;
}
/* Fundo preto, cards brancos: fora dos cards os tokens viram claros; dentro dos cards voltam ao tema claro */
:root{--bg:#000000}
.wrap{--ink:#f4f5f6;--ink2:#c7cad0;--muted:#9a9fa7;--line:#26282c;--line2:#34373c;--sunk:#17181b;--surface:#141518;--segbg:#18191c;color:var(--ink)}
.wrap .card,.wrap .ex,.wrap .kpi,.wrap .tbl,.pmenu,.wrap .alt-tog{--ink:#111315;--ink2:#3d4248;--muted:#7a8088;--line:#eceef0;--line2:#d9dce0;--sunk:#f3f4f6;--surface:#ffffff;--segbg:#e7e9ec;color:var(--ink)}
.wrap .card,.wrap .ex,.wrap .kpi,.wrap .tbl{border-color:#ffffff;box-shadow:none}
.wrap .alt-tog{background:#ffffff}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
h1,h2,h3{margin:0;color:var(--ink);letter-spacing:-.01em}
h1{font-size:1.3rem;font-weight:700}
h2{font-size:1rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.8rem} .num{font-variant-numeric:tabular-nums}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
header.top .small{white-space:nowrap}

.seg{display:grid;gap:2px;padding:3px;background:var(--segbg);border-radius:10px}
nav.tabs.so2{grid-template-columns:repeat(2,1fr)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;grid-template-columns:repeat(4,1fr);margin-bottom:6px;outline:6px solid var(--bg)}
nav.tabs a,.dseg{font:600 .8rem var(--font);text-align:center;padding:8px 2px;border-radius:8px;color:var(--muted);text-decoration:none;border:none;background:transparent;cursor:pointer;position:relative;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--orange);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(234,106,18,.35)}
.dseg.today{color:var(--orange);box-shadow:inset 0 0 0 1.5px var(--orange)}
.dseg[aria-pressed="true"]{background:var(--orange);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(234,106,18,.35)}
.dseg[aria-pressed="true"].did::after{background:#fff}
.dseg.did::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.days{grid-template-columns:repeat(5,1fr);margin:14px 0 12px}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.status{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--line2)}

.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 8px}
.dayhead>div{min-width:0}
.dayhead .lbl{color:var(--orange)}
.progress{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap}
.progress.full{color:var(--green)}

details.tip{margin:4px 0 12px;font-size:.8rem;color:var(--ink2)}
details.tip summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::before{content:"ⓘ ";color:var(--orange)}
details.tip p{margin-top:6px;padding:10px 12px;background:var(--sunk);border-radius:8px}

.ex{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(17,19,21,.06),0 4px 14px rgba(17,19,21,.05);border:1px solid #eceef1}
.ex.done{border-color:#bfe6cf}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex-name{font-size:.95rem;font-weight:700;color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ex.done .ex-name{color:var(--green)}
.ex-name .ok{display:none}
.ex.done .ex-name .ok{display:inline}
.vid{flex:0 0 auto;font-size:.72rem;font-weight:700;color:var(--ink2);border:1px solid var(--line2);padding:4px 9px;border-radius:999px;text-decoration:none;white-space:nowrap}
.meta{font-size:.78rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink2);font-weight:600}
.meta .up{color:var(--orange);font-weight:700}
.obs{font-size:.78rem;color:var(--muted);margin-top:6px}

.sets{margin-top:10px;display:grid;gap:2px}
.set{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:6px;align-items:center;padding:3px 4px;border-radius:8px}
.set.bw{grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) 36px}
.set.head{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:2px}
.set.head span{text-align:center}
.set .n,.set .prev{text-align:center;font-weight:600;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .n{color:var(--ink2)}
.set.ok{background:var(--green-soft)}
.field input{width:100%;font:600 .9rem var(--font);font-variant-numeric:tabular-nums;text-align:center;padding:7px 4px;border-radius:7px;border:none;background:var(--sunk);color:var(--ink)}
.set.ok .field input{background:transparent}
.field input::placeholder{color:#b3b8be;font-weight:500}
.field em{display:none}
.chk{width:32px;height:30px;justify-self:center;border-radius:7px;border:none;background:var(--sunk);color:#b3b8be;font-size:.85rem;font-weight:800;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--green);color:#fff}

.btn{font:700 .9rem var(--font);border:none;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--orange);color:#fff;width:100%;margin-top:6px;box-shadow:0 4px 12px rgba(234,106,18,.25)}

.card{box-shadow:0 1px 2px rgba(17,19,21,.06),0 4px 14px rgba(17,19,21,.05);background:var(--surface);border:1px solid #eceef1;border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.note{background:var(--orange-soft);border-color:transparent}
.card.note h3{color:var(--orange-dk)}
.stack{display:grid;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.kpi{background:var(--surface);border:1px solid #eceef1;box-shadow:0 1px 2px rgba(17,19,21,.06);border-radius:var(--r);padding:10px;display:grid;gap:2px;text-align:center}
.kpi b{font-weight:700;font-size:1.05rem}
.meal{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.meal:first-of-type{border-top:none;padding-top:0}
.meal:last-of-type{padding-bottom:0}
.meal .h{font-weight:700;font-size:.85rem}
.meal .h small{display:block;white-space:nowrap;font-size:.62rem;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
ul.clean{margin:0;padding-left:16px;display:grid;gap:6px}
ul.clean li::marker{color:var(--muted)}
b.ok{color:var(--ink)} b.att{color:var(--orange-dk)}
.sec{margin-top:14px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid #eceef1;border-radius:var(--r);margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:.78rem;font-variant-numeric:tabular-nums;min-width:540px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
th:first-child,td:first-child{text-align:left}
th{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
tr.mile td{background:var(--orange-soft);font-weight:700}
td.meas{color:var(--orange-dk);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:.72rem;font-weight:600;color:var(--muted)}
.form input{font:600 .9rem var(--font);padding:9px 10px;border-radius:8px;border:none;background:var(--sunk);color:var(--ink);width:100%;min-width:0}
.hist{display:grid}
.hist div{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;padding:8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.hist div span{overflow:hidden;text-overflow:ellipsis}
.hist div:last-child{border-bottom:none;padding-bottom:0}
.hist div:first-child{padding-top:0}

.rest{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:var(--ink);color:var(--on-ink);
  border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rest .lab{font-size:.7rem;opacity:.7}
.rest b{font-size:1.05rem;font-weight:700;min-width:44px;text-align:center}
.rest button{background:rgba(255,255,255,.12);border:none;color:inherit;border-radius:999px;height:32px;min-width:32px;padding:0 10px;font:600 .78rem var(--font);cursor:pointer}
.rest.end{background:var(--green)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.8rem;z-index:9;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.ex details.tip{margin:8px 0 0}
.ex.dor{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.ex.dor select,.sel{font:600 .85rem var(--font);padding:8px 10px;border-radius:8px;border:none;background:var(--sunk);color:var(--ink);min-width:0;max-width:100%}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;height:90px;align-items:end}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;height:100%;text-align:center;font-size:.7rem;color:var(--muted)}
.bars i{display:block;border-radius:4px 4px 0 0}
.up-g{color:var(--green);font-weight:700}.att{color:var(--orange-dk);font-weight:600}
tr.now td{background:var(--sunk)}
.alt-tog{display:block;width:100%;margin:0 0 12px;padding:9px;border-radius:10px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink2);font:600 .8rem var(--font);cursor:pointer}
.alt-tog.on{border-style:solid;border-color:var(--orange);color:var(--orange-dk);background:var(--orange-soft)}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.mini div{display:grid;gap:2px}.mini b{font-size:.85rem;white-space:nowrap}.mini .lbl{font-size:.58rem}
.bar-row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}.bar-row b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.balance{display:flex;align-items:baseline;gap:8px;padding-top:8px;border-top:1px solid var(--line)}.balance b{font-size:1.2rem}
.add{display:grid;grid-template-columns:minmax(0,1fr) 56px 48px;gap:8px}
.add input,.mini-in{font:600 .9rem var(--font);padding:10px;border-radius:8px;border:none;background:var(--sunk);color:var(--ink);min-width:0;width:100%}
.del{border:none;background:none;color:var(--muted);font-size:.8rem;cursor:pointer;padding:0 0 0 8px}
details.sup{border-top:1px solid var(--line);padding:10px 0}details.sup:last-child{padding-bottom:0}details.sup:first-of-type{border-top:none;padding-top:0}
details.sup summary{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;list-style:none;font-weight:600}
details.sup summary::-webkit-details-marker{display:none}
details.sup .hist{margin-top:8px;padding-left:44px}
.sc{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:.95rem;color:#fff;background:var(--ink)}
.sc.hi{background:var(--ink)}.sc.md{background:var(--orange)}.sc.lo{background:#b4232c}.sc.na{background:var(--line2);color:var(--ink2)}
button.vid{cursor:pointer;background:var(--surface)}
.guard{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}.ring{width:64px;height:64px}
.gnum{display:grid}.gnum b{font-size:1.6rem;line-height:1}.gnum span{font-size:.8rem;font-weight:700}
.bad{color:#b4232c;font-weight:700}
.pill{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk)}
.qbtns,.chips{display:flex;gap:6px;flex-wrap:wrap}
.qbtns button,.chips button{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:999px;padding:7px 12px;font:600 .78rem var(--font);cursor:pointer}
.qbtns button:first-child{border-color:var(--orange);color:var(--orange-dk)}
.vol{display:grid;grid-template-columns:86px minmax(0,1fr) 24px;gap:8px;align-items:center;font-size:.78rem}.vol b{text-align:right}
.rec{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rc{display:grid;gap:2px;text-align:center;font-size:.7rem;font-weight:700;padding:7px 2px;border-radius:8px;background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc small{font-weight:600;font-size:.62rem;color:var(--muted)}.rc.ok{background:var(--surface);border:1px solid var(--line2)}.rc.mid{background:var(--orange-soft);color:var(--orange-dk)}.rc.low{background:#fbe9ea;color:#b4232c}
.vid.swap{padding:4px 9px}
.ex-top .ex-name{flex:1}
.ex-name::first-letter{text-transform:uppercase}
.ex-top .vid.swap+.vid{margin-left:0}
.anim{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ph{position:relative;aspect-ratio:3/2;background:#111;max-width:100%}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .b{animation:xf 2.6s ease-in-out infinite}
@keyframes xf{0%,30%{opacity:0}50%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ph .b{animation:none;opacity:0}}
.tag2{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:99px}
.mapa{display:grid;grid-template-columns:62px 62px minmax(0,1fr);gap:8px;align-items:center;padding:10px;background:var(--surface)}
.body{position:relative;aspect-ratio:200/369}.body img{position:absolute;inset:0;width:100%;height:100%}.body img:first-child{opacity:.55}
.lbls{display:flex;flex-direction:column;gap:4px;min-width:0}.lbls b{font-size:.8rem;display:flex;align-items:center;gap:6px}.lbls i{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:0 0 8px}
.lbls a{font-size:.72rem;color:var(--muted);margin-top:2px}
:root{--body:#c9cdd2;--body2:#dfe2e5;--eq:#8a9097}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.tags span{font-size:.64rem;font-weight:600;padding:1px 7px;border-radius:99px}
.tags .p{background:var(--green-soft);color:#15803d}.tags .n{background:#fbe9ea;color:#b4232c}
.hist .food{display:block}.hist .food>div{display:flex;justify-content:space-between;gap:12px}
.sugs{display:grid;gap:4px}.sugs:empty{display:none}
.sugs button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font:500 .82rem var(--font);color:var(--ink);cursor:pointer}
.sugs button span{color:var(--muted);font-size:.74rem;white-space:nowrap}
.wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font-size:16px!important}
.ghead{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:16px 2px 6px;display:flex;align-items:center;gap:8px}.ghead::after{content:"";flex:1;height:1px;background:var(--line2)}
.donebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--green-soft);color:#15803d;font-weight:700;font-size:.82rem;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.donebar button{border:1px solid #9fd8b6;background:#fff;color:#15803d;border-radius:8px;padding:5px 10px;font:600 .78rem var(--font);cursor:pointer}
.set{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 36px}.set.bw{grid-template-columns:34px minmax(0,1fr) 36px}
input:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}button:disabled{cursor:default}
.warm .wbox{margin-top:6px;padding:10px 12px;background:var(--sunk);border-radius:8px;font-size:.8rem}.warm ol{margin:0 0 6px;padding-left:18px;display:grid;gap:3px}.warm p{margin:4px 0 0;padding:0;background:none;color:var(--ink2)}
.vid.timer{margin-top:8px;border-color:var(--orange);color:var(--orange-dk)}
.rest.over{background:#b4232c}
.mrow{display:grid;grid-template-columns:84px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:.78rem}.mrow b{text-align:right;font-size:.8rem}.mrow small{color:var(--muted);font-weight:500}
.kbig{display:flex;align-items:baseline;gap:6px}.kbig b{font-size:1.6rem}.kbig span{color:var(--muted);font-size:.8rem}.bar.big{height:10px}
.sugbox{display:grid;gap:6px;background:var(--sunk);border-radius:10px;padding:10px 12px}.sugbox div{display:grid;gap:1px;font-size:.78rem}.sugbox b{font-size:.72rem;color:var(--orange-dk);text-transform:uppercase;letter-spacing:.05em}
.add2{display:grid;gap:8px}.row3{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1.3fr);gap:6px}
.add2 input,.row3 input{font:600 .9rem var(--font);padding:10px;border-radius:8px;border:none;background:var(--sunk);color:var(--ink);min-width:0;width:100%}

function ocorr(test){const o=[];refeicoes().forEach(r=>r.t.split(' + ').forEach(p=>p.split(' ou ').forEach(x=>{const e=eqDe(x);if(e&&test(e))o.push({r,e,q:qtdItem(e,x)})})));return o}
const ctxOk=(e,id)=>e.c.includes(id==='almoco'||id==='jantar'?'r':'l');
function subsDe(x,q,id){const C=EQ.filter(y=>y.g===x.g&&y!==x&&!y.ns&&(!id||ctxOk(y,id))),tot=q*x.v;
  const ok=C.map(y=>({y,q:tot/y.v})).filter(o=>o.q<=o.y.mx+1e-9).slice(0,4).map(o=>fq(o.y,o.q));if(ok.length>=2)return ok;
  const combo=[];C.forEach(y=>{const a=y.mx*y.v,rest=tot-a;if(rest<=0)return;C.forEach(z=>{if(z===y||combo.length>=4)return;const qz=rest/z.v;if(qz<=z.mx+1e-9&&!combo.some(c=>c.k===z.k+y.k||c.k===y.k+z.k))combo.push({k:y.k+z.k,t:fq(y,y.mx)+' com '+fq(z,qz)})})});
  return ok.concat(combo.map(c=>c.t)).slice(0,4)}
function trocar(txt,modo){const t=nrm(txt);let m=modo;if(/nao tenho|nao tem|acabou|faltou|sem /.test(t))m='falta';else if(/^(eu )?(tenho|tem)\b/.test(t))m='tenho';
  const e=eqDe(t);
  if(!e)return null;const blocos=[];
  if(m==='falta'){const oc=ocorr(x=>x===e);
    if(oc.length)oc.slice(0,3).forEach(o=>{const s=subsDe(e,o.q,o.r.id);blocos.push([`${o.r.nome} · ${o.r.h}`,`No lugar de ${fq(e,o.q)}, use:`,s])});
    else blocos.push([`${fq(e,e.d)} equivale a`,'Não está no seu plano de hoje. Se for comer, troque por:',subsDe(e,e.d)])}
  else{const oc=ocorr(x=>x.g===e.g&&x!==e),ja=ocorr(x=>x===e);
    oc.filter(o=>ctxOk(e,o.r.id)).slice(0,3).forEach(o=>{const qq=o.q*o.e.v/e.v;if(qq<=e.mx+1e-9)blocos.push([`${o.r.nome} · ${o.r.h}`,`Troque ${fq(o.e,o.q)} por:`,[fq(e,qq)]])});
    if(ja.length)blocos.push(['Já está no plano',ja.map(o=>`${o.r.nome}: ${fq(e,o.q)}`).join(' · '),[]]);
    if(!blocos.length)blocos.push([`${fq(e,e.d)} equivale a`,'Use no lugar de:',subsDe(e,e.d)]);
    if(e.uso)blocos.push(['Onde usar',e.uso[0].toUpperCase()+e.uso.slice(1)+'.',[]])}
  return {m,e,blocos,lim:`Limite: até ${fq(e,e.mx)} por refeição. Grupo: ${GRP[e.g]}.`}}

let fat0=BASE.peso*BASE.gord/100, lean0=BASE.peso-fat0;
function proj(n,fr,lr){const f=fat0-fr*n,l=lean0+lr*n;return {f,l,p:f+l,bf:f/(f+l)*100}}
function navy(c,p){if(!c||c<50)return null;return (BASE.sexo==='f'?76:64)-20*(BASE.altura/c)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function weekOf(iso){return Math.round((new Date(iso+'T12:00:00')-new Date(BASE.data+'T12:00:00'))/864e5/7)}
function renderChart(){
  const W=400,H=250,L=38,R=22,T=14,B=28,N=12, y0=18,y1=27;
  const x=n=>L+(W-L-R)*n/N, y=v=>T+(H-T-B)*(y1-v)/(y1-y0);
  let band='',mid='';
  for(let n=0;n<=N;n++){band+=(n?'L':'M')+x(n)+','+y(proj(n,.4,.2).bf)}
  for(let n=N;n>=0;n--){band+='L'+x(n)+','+y(proj(n,.2,.05).bf)}
  for(let n=0;n<=N;n++){mid+=(n?'L':'M')+x(n)+','+y(proj(n,.3,.12).bf)}
  let grid='';for(let v=y0;v<=y1;v++){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13" fill="var(--muted)">${v}%</text>`}
  for(let n=0;n<=N;n+=4){grid+=`<text x="${x(n)}" y="${H-8}" text-anchor="${n===N?'end':n?'middle':'start'}" font-size="13" fill="var(--muted)">${n?'sem '+n:'hoje'}</text>`}
  const pts=medidas.map(m=>({n:weekOf(m.data)+((new Date(m.data+'T12:00:00')-new Date(addDays(BASE.data,weekOf(m.data)*7)+'T12:00:00'))/864e5/7),bf:navy(m.cintura,m.pescoco)})).filter(p=>p.bf&&p.n>=0&&p.n<=N&&p.bf>=y0-1&&p.bf<=y1+1)
    .map(p=>`<circle cx="${x(p.n)}" cy="${y(Math.max(y0,Math.min(y1,p.bf)))}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  const end=proj(N,.3,.12).bf;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projeção do percentual de gordura em 12 semanas">${grid}
   <path d="${band}Z" fill="var(--orange)" fill-opacity=".1" stroke="none"/><path d="${mid}" fill="none" stroke="var(--orange)" stroke-width="2"/>
   <circle cx="${x(N)}" cy="${y(end)}" r="5" fill="var(--orange)"/><text x="${x(N)-8}" y="${y(end)-10}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${end.toFixed(1).replace('.',',')}%</text>${pts}</svg>`;
}

      if(!a)r.novos.push(x);else if(igual(a,x))r.iguais++;else{r.conflitos++;R.conflitos.push({col:c,k,id,atual:a,arq:x,usar:false})}});R.cols[c]=r});

  const done=()=>{clearTimeout(timer);$('#status').textContent='Histórico salvo na sua conta. Só você vê.'};
  const keepInputs=()=>route()==='treino'||route()==='casa';
  unsubs.push(base.collection('sessoes').orderBy('ts','desc').limit(300).onSnapshot(s=>{sessions=s.docs.map(d=>({...d.data(),_id:d.id}));if(!s.metadata.fromCache)done();if(!keepInputs()||!document.activeElement||!document.activeElement.matches('input'))agendar()},()=>{clearTimeout(timer);$('#status').textContent='Histórico indisponível agora. Salvando neste aparelho.'}));
  unsubs.push(base.collection('diario').limit(120).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());diario=m;if(route()==='comida'||route()==='progresso')agendar()},()=>{}));
  unsubs.push(base.collection('suplementos').orderBy('ts','asc').limit(50).onSnapshot(s=>{supl=s.docs.map(d=>({...d.data(),_id:d.id}));if(!(document.activeElement&&document.activeElement.matches('input,select')))agendar()},()=>{}));
  unsubs.push(base.collection('comida').orderBy('ts','desc').limit(400).onSnapshot(s=>{comidas=s.docs.map(d=>({...d.data(),_id:d.id}));if((route()==='comida'||route()==='progresso')&&!(document.activeElement&&document.activeElement.matches('input')))agendar()},()=>{}));
  unsubs.push(base.collection('medidas').orderBy('data','asc').limit(500).onSnapshot(s=>{medidas=s.docs.map(d=>({...d.data(),_id:d.id}));if(!s.metadata.fromCache)done();if(route()==='progresso'&&!(document.activeElement&&document.activeElement.matches('input')))agendar()},()=>{}));}
function trocarPerfil(id){if(!perfis()[id])return;PERF=id;try{localStorage.setItem('perfilAtual',JSON.stringify(id))}catch(e){}
  sessions=[];medidas=[];comidas=[];supl=[];diario={};sel={};sel.treino=diaHoje();sel.casa=casaHoje();EDIT=false;editPerf=false;
  aplicarPerfil();loadLocal();if(DB&&UID){mode='db';conectar()}else mode='local';$('#perfMenu').hidden=true;render();scrollTo(0,0);if(perfis()[id].nome)toast('Perfil: '+perfis()[id].nome)}
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-perfmenu]')){const m=$('#perfMenu');m.innerHTML=renderPerfMenu();m.hidden=!m.hidden;return}
  const pf=t.closest('[data-perf]');if(pf){trocarPerfil(pf.dataset.perf);return}
  if(t.closest('[data-perfedit]')){editPerf=true;$('#perfMenu').hidden=true;render();scrollTo(0,0);return}
  if(t.closest('[data-perfcancel]')){editPerf=false;render();return}
  if(t.closest('[data-novoperf]')){const p=perfis(),id='p'+Date.now().toString(36);p[id]={nome:''};salvarPerfis(p);trocarPerfil(id);setTimeout(()=>{const n=$('#pfNome');if(n)n.focus()},50);return}
  if(t.closest('[data-perfdel]')){const p=perfis();if(PERF!=='jean'&&p[PERF]&&!p[PERF].peso){delete p[PERF];salvarPerfis(p)}trocarPerfil('jean');return}
  const m=$('#perfMenu');if(m&&!m.hidden&&!t.closest('#perfMenu'))m.hidden=true});
document.addEventListener('change',e=>{if(e.target.id==='pfSem'){const c=$('#pfCustom');if(c)c.hidden=e.target.value!=='custom'}});
document.addEventListener('click',e=>{if(!e.target.closest('[data-igualjean]'))return;let jm='recomp';try{jm=JSON.parse(localStorage.getItem('modo')||'"recomp"')}catch(err){}
  const f=(id,v)=>{const x=$(id);if(x)x.value=v};f('#pfModo',jm);f('#pfWhey','1');f('#pfLeite','1');f('#pfSem','jean5');const c=$('#pfCustom');if(c)c.hidden=true;toast('Plano do Jean selecionado. Agora preencha seus dados.');const i=$('#pfIdade');if(i)i.focus()});
document.addEventListener('submit',async e=>{if(e.target.id==='fPerf'){e.preventDefault();await salvarSetup()}
  else if(e.target.id==='fNovoPerf'){e.preventDefault();const nm=($('#npNome').value||'').trim();if(!nm)return;const id=nrm(nm).replace(/[^a-z0-9]/g,'').slice(0,20)||('p'+Date.now());const p=perfis();if(!p[id]){p[id]={nome:nm.charAt(0).toUpperCase()+nm.slice(1)};salvarPerfis(p)}trocarPerfil(id)}});
function loadLocal(){_memo={};diario=ls.get('loc_diario',{});supl=ls.get('loc_suplementos',[]);comidas=ls.get('loc_comida',[]);sessions=ls.get('loc_sessoes',[]);medidas=ls.get('loc_medidas',[]).sort((a,b)=>a.data<b.data?-1:1)}
async function init(){
  try{const pa=JSON.parse(localStorage.getItem('perfilAtual')||'null');if(pa&&perfis()[pa])PERF=pa}catch(e){}
  sel.treino=diaHoje();sel.casa=casaHoje();aplicarPerfil();loadLocal();render();
  let user=null;
  try{DB=window.claude&&await claude.use('db');user=window.claude&&await claude.use('user');UID=user&&await user.id()}catch(e){}
  try{dl=window.claude&&await claude.use('downloads')}catch(e){}
  try{sampleFn=window.claude&&await claude.use('sample')}catch(e){}
  if(!DB||!UID){DB=null;$('#status').textContent='Dados salvos neste celular. Faça backup em Progresso.';render();return}
  try{const c=await DB.doc('data/users/'+UID+'/config').get();if(c.exists){const rp=(c.data()||{}).perfis;if(rp&&typeof rp==='object'){ls.set('perfis',{...perfis(),...rp});if(!perfis()[PERF])PERF='jean';aplicarPerfil()}}else salvarPerfis(perfis())}catch(e){}
  conectar();render();
}
init();
</script>

if('serviceWorker' in navigator)addEventListener('load',()=>{const t0=Date.now();let pend=false,done=false;
const tem=!!navigator.serviceWorker.controller;
const recarregar=()=>{if(done)return;done=true;location.reload()};
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!tem)return;if(document.hidden||Date.now()-t0<6000)recarregar();else pend=true});
navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
 const chk=()=>reg.update().catch(()=>{});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){if(pend)recarregar()}else chk()});
 setInterval(chk,30*60*1000);
}).catch(()=>{})})</script>
